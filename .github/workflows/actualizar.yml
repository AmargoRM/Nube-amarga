name: Actualizar GeoJSON desde Neon
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - run: python update_geojson.py
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/casos.geojson
          git diff --staged --quiet || git commit -m "Actualiza casos.geojson"
          git push origin HEAD:main
